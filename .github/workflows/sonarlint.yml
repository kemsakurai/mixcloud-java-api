name: PR Code Review
on: [pull_request]

jobs:
  sonarlint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for git diff
          
      - uses: kemsakurai/action-sonarlint@main
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
